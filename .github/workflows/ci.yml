name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The fixture sheets are drawn in Verdana, Times New Roman and Consolas
    # when the machine has them, and the suite's accuracy thresholds were set
    # against those faces. With the DejaVu or Liberation faces of a Linux
    # runner, four or one of them fail (see review.md), so this runs where
    # the suite was verified.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
